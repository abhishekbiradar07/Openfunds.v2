services:
  - type: web
    name: openfunds-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: openfunds-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://openfunds.streamlit.app
    healthCheckPath: /api/v1/health

databases:
  - name: openfunds-db
    databaseName: openfunds
    user: openfunds_user
    plan: free
